<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANIMA GAME — si gioca su animagame.io</title>
<meta name="description" content="ANIMA GAME vive su animagame.io.">
<!-- Il gioco è VIVO da giorni su animagame.io. Questa pagina diceva «Presto qui»
     e mandava via chi arrivava convinto che non esistesse ancora niente.
     Un prodotto, un indirizzo vero; gli altri sono porte. — D.R.A.G.O., 2026-08-06 -->
<link rel="canonical" href="https://animagame.io/">
<meta http-equiv="refresh" content="0; url=https://animagame.io/">
<style>
  :root{
    --bg-deep:#0C0B0E; --amber:#C9A15E; --verde:#38E08A;
    --text-hi:#ECE7DF; --text-lo:#A7A29B; --line:#3A3730;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg-deep); color:var(--text-hi);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:2rem;
    background-image:radial-gradient(ellipse at 50% 38%, rgba(201,161,94,.07), transparent 62%);
  }
  main{max-width:36rem}
  .marca{
    font-family:"Courier Prime","Courier New",monospace;
    letter-spacing:.35em; font-size:.85rem; color:var(--amber);
    text-transform:uppercase; margin-bottom:1.4rem;
  }
  h1{font-size:clamp(1.7rem,5vw,2.5rem); font-weight:400; letter-spacing:.03em; line-height:1.35; margin-bottom:1rem}
  h1 b{color:var(--amber); font-weight:400}
  .riga{width:3.5rem; height:1px; background:var(--line); margin:1.5rem auto}
  p{color:var(--text-lo); line-height:1.7; font-size:1.02rem}
  .porta{
    display:inline-block; margin-top:2rem; padding:.7rem 1.5rem;
    border:1px solid var(--verde); border-radius:2px;
    font-family:"Courier Prime","Courier New",monospace;
    font-size:.85rem; letter-spacing:.2em; color:var(--verde); text-decoration:none;
  }
  .porta:hover{background:rgba(56,224,138,.08)}
  footer{
    position:fixed; left:0; right:0; bottom:1.2rem;
    font-family:"Courier Prime","Courier New",monospace;
    font-size:.72rem; letter-spacing:.1em; color:var(--text-lo); text-align:center;
  }
  footer a{color:var(--text-lo); text-decoration:none; border-bottom:1px solid var(--line)}
  footer a:hover{color:var(--amber)}
  footer .sep{margin:0 .5rem; color:var(--line)}
</style>
</head>
<body>
<main>
  <div class="marca">&#9673; Anima Game</div>
  <h1>Il gioco è <b>già qui</b>.</h1>
  <div class="riga"></div>
  <p>Si entra da <b>animagame.io</b>. Ti ci stiamo portando adesso.</p>
  <a class="porta" href="https://animagame.io/">&gt; entra</a>
</main>
<footer>
  <a href="https://systema77.com">systema77.com — la casa</a><span class="sep">·</span><a href="https://cyberboomer.io">cyberboomer.io — la voce</a>
</footer>
<script>location.replace("https://animagame.io/");</script>
</body>
</html>
